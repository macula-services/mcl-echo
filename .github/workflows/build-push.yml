# Build the OCI image for mcl-echo and push to the registry.
#
# TWO CHANNELS, AND ONLY A RELEASE MOVES :latest.
#
#   push of v*   : publishes :<semver>, then :latest once attest signed it <- the dev fleet's deploy channel
#   push to main : publishes :main and :<sha>       <- the tip, for trying; nothing follows it
#
# The dev fleet (macula-fleet) runs :latest: each box's reconciler pulls it, verifies the
# digest it resolved to (signature, SBOM, provenance) and runs that digest. So a green v* tag
# IS the deploy, with no commit to the fleet, and a push to main deploys nothing. The semver
# tags stay published, so a bad release can be pinned back to a known one.
#
# NOTE ON PUSHING THIS FILE. An HTTPS push that creates or updates anything under
# .github/workflows/ needs a token carrying the `workflow' scope, and the error
# names the FILE rather than the missing scope. Use an SSH remote and the problem
# does not arise.

name: build-and-push

on:
  push:
    branches: [main]
    tags:     ['v*']
    # ⚠ THE TAG BUILD STILL RUNS. Checked empirically rather than from the
    # docs, which do not say: GitHub's `on.push` reference states only that
    # filters combine with AND and is silent on whether path filters are
    # evaluated for tag pushes. If they were, this block would silently
    # suppress the SEMVER build on a release tag and take out the rollback
    # archive -- a worse and quieter failure than the one it prevents.
    #
    # macula-io/macula-station's `ci.yml` carries this exact shape, `branches`
    # and `tags` and `paths-ignore` in one `push` block, and every tag push in
    # its history triggers it, v0.4.0 through v0.5.0.
    #
    # WHAT THAT EVIDENCE DOES NOT COVER, so nobody reads it as more than it is:
    # every one of those tags points at a commit that touched code. It proves a
    # tag push fires DESPITE `paths-ignore` being present, which is the case
    # that matters and the one release tags are. It does NOT isolate a tag cut
    # on a commit touching only `.md` files -- if path filters were evaluated
    # for tag pushes, that one tag would be suppressed and this history would
    # look identical, because none of it tests that. Judged not worth chasing:
    # release tags are cut on code, and the common case is proven.
    #
    # Re-check this if GitHub ever changes that behaviour, because the failure
    # mode is a release that quietly publishes no image.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

# ONE IMAGE BUILD IN FLIGHT PER REF. Every push to main builds and pushes
# :latest; without this, three quick commits run three builds that finish in
# whatever order the runners please, and :latest ends up being whichever
# finished LAST, not whichever was pushed last -- watchtower then rolls the
# fleet onto an older commit and flaps. A sibling service hit exactly that live.
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The digest the push produced: the one the attest job signs.
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Emits the COMPLETE tag list, not a fragment of one. The previous
      # shape computed a single variable and pasted it beside a hardcoded
      # :latest, which is what made a tag push move :latest: the condition
      # governed only half the list.
      - name: Set tags
        id: tag
        run: |
          # A v* tag publishes its version here; :latest moves in promote-latest, only after
          # attest has signed this digest. main publishes :main and :<sha>; no box follows those.
          img=ghcr.io/macula-services/mcl-echo
          case "${GITHUB_REF}" in
            refs/tags/v*)    echo "tags=$img:${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT" ;;
            refs/heads/main) echo "tags=$img:main,$img:${GITHUB_SHA}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::only a v* tag publishes a version and :latest, only main :main and :<sha>; refusing ${GITHUB_REF}"; exit 1 ;;
          esac

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          # The commit the image was built from, readable from the image itself.
          build-args: |
            REVISION=${{ github.sha }}

  # SIGNED BY DIGEST, SBOM AND PROVENANCE ATTESTED, keyless, so a box can refuse any
  # mcl-echo digest that did not come from this workflow on a commit of this repository
  # (macula-fleet's reconciler checks it before it runs the image). Pinned by full commit
  # sha: the signing identity is that file at that ref. See macula-ci-images' README.
  attest:
    needs: build-and-push
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: macula-io/macula-ci-images/.github/workflows/attest-image.yml@b304162c9b46b366f93af362d3a76f17ae01794f
    with:
      image: ghcr.io/macula-services/mcl-echo
      digest: ${{ needs.build-and-push.outputs.digest }}

  # :latest is the dev fleet's deploy channel, so it moves LAST: only on a v* tag, and only once
  # attest has signed and attested this digest. A box that pulls :latest in the window between
  # push and signature would otherwise refuse the release (and remember that for an hour).
  promote-latest:
    needs: [build-and-push, attest]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-and-push.outputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point :latest at the signed digest
        env:
          IMAGE: ghcr.io/macula-services/mcl-echo
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
