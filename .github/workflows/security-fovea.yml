name: security-fovea

on:
  workflow_dispatch:
  push:
    paths:
      - "security/fovea/**"
      - ".github/workflows/security-fovea.yml"
  pull_request:
    paths:
      - "security/fovea/**"
      - ".github/workflows/security-fovea.yml"

jobs:
  fovea:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lint first: grid closure, anti-theater, copy-paste. Failures annotate
      # the offending cell file in the PR diff.
      - name: "fovea lint"
        uses: macula-io/macula-fovea@main
        with:
          dir: security/fovea
          command: lint

      # Scorecard, machine-readable, as a job summary block. Runs even when
      # lint is red — a red run is exactly the run whose report matters.
      - name: "fovea score"
        if: always()
        uses: macula-io/macula-fovea@main
        with:
          dir: security/fovea
          command: score

      # Persist the artifacts the action wrote (score.json + scorecard.md)
      # even when lint made the run red: the report is the point of a red run.
      - name: "Upload fovea artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fovea-artifacts
          path: fovea-artifacts/
          retention-days: 30
