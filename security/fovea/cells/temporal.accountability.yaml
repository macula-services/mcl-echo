id: temporal.accountability
status: na
owner: roeland@macula.io
na_reason: >-
  The service keeps no logs and no retention schedule of its own; what is
  attributable over time — changes, deploys, version history — is git and
  the changelog, assessed in internal.accountability and
  create.accountability. No service-local temporal attribution mechanism
  exists to record.
