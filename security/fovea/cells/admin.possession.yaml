id: admin.possession
status: na
owner: roeland@macula.io
na_reason: >-
  Possession of the only carry-awayable asset (the identity key volume) is
  assessed in decommission.possession; an administrator is just the most
  convenient thief of it, and no administrative mechanism in this repo
  changes that story — host-level access control is the operator's domain
  (out of scope). A separate admin.possession cell would restate
  decommission.possession with a different actor and no new defense.
