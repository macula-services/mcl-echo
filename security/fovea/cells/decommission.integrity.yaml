id: decommission.integrity
status: na
owner: roeland@macula.io
na_reason: >-
  Integrity of retired material — a resold disk, a reused volume — is the
  same custody story as decommission.possession: the volume's fate after
  retirement is one event, not two. No distinct mechanism exists beyond
  deletion-as-retirement.
