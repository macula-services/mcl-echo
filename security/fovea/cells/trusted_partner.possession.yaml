id: trusted_partner.possession
status: na
owner: roeland@macula.io
na_reason: >-
  Vendors never hold the one carry-awayable asset — the identity key — by
  design: it is generated on the node into the mounted volume and never
  leaves it. The realm signing key is public. Possession is a
  physical/host-domain threat assessed in decommission.possession with no
  partner-specific surface.
