id: decommission.confidentiality
status: na
owner: roeland@macula.io
na_reason: >-
  A retired node holds nothing confidential: the service never stored
  application data, and the one secret's fate at retirement is the
  possession story. Nothing leaks from a decommissioned echo node except
  the identity key, assessed in decommission.possession.
