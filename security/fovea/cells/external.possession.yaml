na_reason: >-
  Possession is a physical-domain event; the actor column 'external' models
  network adversaries. An outside party physically taking the node or its
  volume is the decommission.possession threat with a different attacker,
  and the service-local mechanism (volume = identity, deletion =
  retirement) is unchanged. Duplication with no new defense.
