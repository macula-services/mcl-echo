id: in_motion.possession
status: na
owner: roeland@macula.io
na_reason: >-
  Possession is a physical-domain property of stored assets; data in
  motion cannot be "possessed" in the Parkerian sense (a captured frame is
  a confidentiality or authenticity event, not a custody event). No
  distinct mechanism exists to record.
threat:
  definition: ""
  manifestations: []
defense:
  detection: []
  countermeasures: []
  recovery: []
notes: "Declared N/A with reason; interception is in_motion.confidentiality, tampering is in_motion.integrity."
