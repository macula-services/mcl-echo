id: at_rest.authenticity
status: assessed
owner: roeland@macula.io
threat:
  definition: >-
    The identity material on disk is not what the node believes it is: a
    substituted key file that makes the node prove a different identity
    than the one the org admitted.
  manifestations:
    - A swapped identity.key on the volume, presenting the node as another id.
    - A restored backup of an old key re-claiming a retired node id.
defense:
  detection:
    - measure: >-
        The realm binds the D25 delegation to the node id the key proves;
        a substituted key proves a different id, for which no delegation
        exists — the provider desk shows no authorized row.
      status: by_design
      source: README.md "The realm issues this node's D25 delegation after admission"
  countermeasures:
    - measure: >-
        The key is generated by mcl_om_identity into the mounted volume and
        never enters the image or repository — the only key that exists is
        the one the node minted.
      status: by_design
      source: config/sys.config.src identity_key_path comment
  recovery:
    - measure: "Restore the volume from the named volume; deleting it retires the id, so a wrong key is removed by removing the volume."
      status: by_design
      source: deploy/docker-compose.yml
notes: >-
  Authenticity of stored identity collapses into the realm's admission
  binding — which is why the trust-anchor register lists the realm signing
  key first.
