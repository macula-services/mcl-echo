# mcl-echo — how to run this service.
#
# Runnable as-is. It carries what the SERVICE knows about itself: its image, its
# port, the environment variables its own code reads, and its health check.
#
#   MCL_ORG=mcl-echo \
#     MCL_REALM=<sha256 of the realm name io.macula, 64-hex> \
#     MACULA_STATION_SEEDS=station.example:4433 \
#     MACULA_STATION_NODE_IDS=<64-hex node id of that station> \
#     docker compose -p mcl-echo -f deploy/docker-compose.yml up -d
#
# IF YOU DEPLOY THROUGH SOMETHING ELSE, keep this file anyway and let the other
# thing carry PLACEMENT: which host, which station, which realm, which secret
# store. The split is worth holding to, because the alternative is a config table
# in a README and the real environment somewhere else, drifting apart with
# nothing checking them.

services:
  mcl-echo:
    image: ghcr.io/macula-services/mcl-echo:latest
    container_name: mcl-echo
    restart: unless-stopped
    # HOST NETWORKING IS NOT LAZINESS. macula stations are reachable over IPv6
    # only, and a default docker bridge has no IPv6, so a bridged container
    # connects and then sits there with no healthy links, looking fine. If you
    # do want a bridge, give it IPv6 explicitly.
    network_mode: host
    labels:
      # Only meaningful if you run watchtower: it pulls a new :latest and
      # recreates the container. Harmless otherwise.
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      # No default. A service that guesses its org announces itself where
      # nobody can attribute it, and that looks exactly like a healthy node.
      # One org per service (plan C): mcl-echo under the io.macula realm.
      - MCL_ORG=${MCL_ORG:?set MCL_ORG to the service org (mcl-echo)}
      # The realm tag is sha256 of the REALM name (io.macula), independent
      # of the org since the org-per-service cutover.
      - MCL_REALM=${MCL_REALM:?set MCL_REALM to the 64-hex realm tag}
      # Informational labels the realm's operator sees on this service's
      # provider-authorization row.
      - MCL_SERVICE_NAME=${MCL_SERVICE_NAME:-mcl-echo}
      - MCL_BOX=${MCL_BOX:-}
      # No default either: naming a realm costs nothing, dialling somebody's
      # production station from every dev clone does. The 11.x dial is PINNED:
      # every seed host pairs with its station's node id (D5).
      - MACULA_STATION_SEEDS=${MACULA_STATION_SEEDS:?set MACULA_STATION_SEEDS to "host[:port][,host[:port]...]"}
      - MACULA_STATION_NODE_IDS=${MACULA_STATION_NODE_IDS:?set MACULA_STATION_NODE_IDS to the matching 64-hex node ids, comma-separated}
      - MCL_NODE_NAME=mcl_echo
      - MCL_NODE_HOST=127.0.0.1
      - MCL_COOKIE=mcl_echo
      # Host networking means a port already bound on this host fails SILENTLY.
      - MCL_HEALTH_PORT=8461
